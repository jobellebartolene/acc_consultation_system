{% extends "base.html" %}
{% block title %}{{ error.code }} Error{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">{{ error.code }}</div>
  <h1>{{ error.name }}</h1>
  <p>{{ error.description }}</p>
  <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn">Back to safety</a>
</div>
{% endblock %}
